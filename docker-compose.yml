services:
  aml-memory-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: e2mem-evidence-anchor:v2.6
    container_name: aml-e2mem-evidence-anchor
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - memory_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  memory_data:
